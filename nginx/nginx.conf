user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    #--------------------------------------------------------------------------------------------------      

    # Rate Limits

    limit_req_zone $binary_remote_addr zone=mylimit:1m rate=20r/s;

    #--------------------------------------------------------------------------------------------------

    # Reject direct IPv4 access
    
    server {
        listen 443 ssl;
        http2 on;
        server_name (IPv4_Address);
        include /etc/nginx/conf.d/nginx_tls.conf;
        include /etc/nginx/conf.d/nginx_security.conf;
        return 403;
    }

    # Reject direct IPv6 access
    
    server {
        listen [::]:443 ssl;
        http2 on;
        server_name (IPv6_Address);
        include /etc/nginx/conf.d/nginx_tls.conf;
        include /etc/nginx/conf.d/nginx_security.conf;
        return 403;
    }
    
    #--------------------------------------------------------------------------------------------------
    
    # IPv4 Redirect to HTTPS

    server {
        listen 80;
        server_name (FQDN);
        limit_req zone=mylimit;
        rewrite ^ https://(FQDN) permanent;
    }

    # IPv6 Redirect to HTTPS

    server {
        listen [::]:80;
        server_name (FQDN);
        limit_req zone=mylimit;
        rewrite ^ https://(FQDN) permanent;
    }
 
    #---------------------------------------------------------------------------------------------------

    include /etc/nginx/conf.d/nginx_yap_ipv4.conf;
    include /etc/nginx/conf.d/nginx_yap_ipv6.conf;
}
