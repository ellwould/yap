<!DOCTYPE html>
<html lang=en translate=no>
<head>
  <meta charset=UTF-8>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes"/>
  <title>YAP (Yet Another PBX)</title>
  <style>

/* CSS Wallpaper Start */
    
.wallpaper {
  animation:slide 15s ease-in-out infinite alternate;
  bottom:0;
  left:-50vh;
  opacity:.5;
  position:fixed;
  right:-50vh;
  top:0;
  z-index:-1;
}

.wallpaper-main-menu {
  background-image: linear-gradient(-45deg, #B5010F 50vh, #FE7C86 25vh);
}

.wallpaper-user-account {
  background-image: linear-gradient(-45deg, #62748E 50vh, #B0BAC9 25vh);
}

.wallpaper-group {
  background-image: linear-gradient(-45deg, #E61876 50vh, #F494BF 25vh);
}

.wallpaper-pbx {
  background-image: linear-gradient(-45deg, #6E11B0 50vh, #CB91F4 25vh);
}

.wallpaper-sip-extension {
  background-image: linear-gradient(-45deg, #432DD7 50vh, #9C90EA 25vh);
}

.wallpaper-sip-trunk {
  background-image: linear-gradient(-45deg, #2984D1 50vh, #98C5EB 25vh);
}

.wallpaper-server-log {
  background-image: linear-gradient(-45deg, #BB4D1A 50vh, #F0B295 25vh);
}

.wallpaper-server-information {
  background-image: linear-gradient(-45deg, #D83A00 50vh, #FF9B76 25vh);
}

.wallpaper2 {
  animation-direction:alternate-reverse;
  animation-duration:20s;
}

.wallpaper3 {
  animation-duration:25s;
}

@keyframes slide {
  from {
    transform:translateX(-50vh);
  }
  to {
    transform:translateX(50vh);
  }
}

/* CSS Wallpaper End */

body {
