<!DOCTYPE html>
<html lang=en translate=no>
<head>
  <meta charset=UTF-8>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes"/>
  <title>YAP (Yet Another PBX)</title>
  <style>

/* CSS Wallpaper Start */
    
.wallpaper {
  animation:slide 15s ease-in-out infinite alternate;
  background-image: linear-gradient(-45deg, #B5010F 50vh, #D2666F 25vh);
  bottom:0;
  left:-50vh;
  opacity:.5;
  position:fixed;
  right:-50vh;
  top:0;
  z-index:-1;
}

.wallpaper2 {
  animation-direction:alternate-reverse;
  animation-duration:20s;
}

.wallpaper3 {
  animation-duration:25s;
}

@keyframes slide {
  from {
    transform:translateX(-50vh);
  }
  to {
    transform:translateX(50vh);
  }
}

/* CSS Wallpaper End */

body {
  width: auto;
  height:auto;
  margin-left: auto;
  margin-right: auto;
  margin-top: auto;
  margin-bottom: auto;
  font-family: sans-serif;
  text-align: center;
  -ms-overflow-style: none;
  overflow-y: scroll;
}

.header{
  display: flex;
  flex-direction: column;  
  justify-content: center;
  align-items: center;
  position: relative;
}

.header-button {
  width: 100px;
}
  
.footer {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  position: relative;
}

.footer-button {
  width: 170px;
}

  font-size: 2em;

  background-color: #B5010F;
  text-shadow: -1px 0 #000000, 0 1px #000000, 1px 0 #000000, 0 -1px #000000;
  border-radius: 5px;
  border: 7.5px outset #F0F0F0;
  padding-top: 15px;
  padding-right: 15px;
  padding-bottom: 15px;
  padding-left: 15px;
}

table, th, td {
  font-size: 1em;
  font-family: sans-serif;

  margin-right: auto;
  margin-top: auto;
  margin-bottom: auto;
  border: 4px solid #000000;

  height: auto;

}

th {
  font-weight: bold;

td {

}

div {

  margin-right: auto;
  margin-top: auto;
  margin-bottom: auto;
  width: auto;
  height: auto;
  padding-top: 0px;
  padding-bottom: 0px;
  padding-left: 0px;
  padding-right: 0px;
}

input[type=text], select {
  padding: 8px;
  width: 300px;

  margin-right: auto;
  margin-top: auto;
  margin-bottom: auto;

  display: inline-block;
  border: 4px solid #000000;
  border-radius: 5px;

  max-width: 100%;
  max-height: 100%;
  height: 100px;
  text-align: center;
  padding: 0px;
  background-color: #F0F0F0;
  color: #000000;
  font-size: 20px;
  padding: 14px 20px;
  margin: 8px 0;
  border: 4px solid #000000;
  border-radius: 5px;

}

input[type=submit]:hover {
