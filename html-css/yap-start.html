<!DOCTYPE html>
<html lang=en translate=no>
<head>
  <meta charset=UTF-8>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes"/>
  <title>YAP (Yet Another PBX)</title>
  <style>

/* CSS Wallpaper Start */
    
.wallpaper {
  animation:slide 15s ease-in-out infinite alternate;
  background-image: linear-gradient(-45deg, #B5010F 50vh, #D2666F 25vh);
  bottom:0;
  left:-50vh;
  opacity:.5;
  position:fixed;
  right:-50vh;
  top:0;
  z-index:-1;
}

.wallpaper2 {
  animation-direction:alternate-reverse;
  animation-duration:20s;
}

.wallpaper3 {
  animation-duration:25s;
}

@keyframes slide {
  from {
    transform:translateX(-50vh);
  }
  to {
    transform:translateX(50vh);
  }
}

/* CSS Wallpaper End */

body {
  width: auto;
  height: auto;
  margin-left: auto;
  margin-right: auto;
  margin-top: auto;
  margin-bottom: auto;
  text-align: center;
  -ms-overflow-style: none;
  overflow-y: none;
  overflow-w: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
}

.header{
  top: 0;
  left: 20vw;
  right: 20vw;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  position: absolute;
}

.headerButton {
  width: 100px;
}
  
.footer {
  bottom: 0;
  left: 20vw;
  right: 20vw;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  position: absolute;
}

.footerButton {
  width: 170px;
}
  
h1, h2{
  font-size: 2em;
  font-family: sans-serif;
  color: #F0F0F0;
  background-color: #B5010F;
  text-shadow: -1px 0 #000000, 0 1px #000000, 1px 0 #000000, 0 -1px #000000;
  border-radius: 5px;
  border: 7.5px outset #f0f0f0;
  padding-top: 15px;
  padding-right: 15px;
  padding-bottom: 15px;
  padding-left: 15px;
  opacity: .7;
  /* Title Light Shadow */
  animation: TitleLightMove 5s infinite;
}
  @keyframes TitleLightMove {
    50% {box-shadow:
       0 0 50px #B5010F;
    }
  }
    
table, th, td {
  font-size: 20px;
  margin-left: auto;
  margin-right: auto;
  margin-top: auto;
  margin-bottom: auto;
  border: 4px solid #000000;
  width: auto;
  height: auto;
  color: #000000;
  border-collapse: collapse;
  background: #E8B2B7;
}

th, td {
  padding: 8px;
}

th {
  font-weight: bold;
}

div {
  margin-left: auto;
  margin-right: auto;
  margin-top: auto;
  margin-bottom: auto;
  width: auto;
  height: auto;
}
    
input[type=text], select {
  padding: 8px;
  width: 300px;
  height: auto;
  margin-left: auto;
  margin-right: auto;
  margin-top: auto;
  margin-bottom: auto;
  color: #000000;
  background-color: #F0F0F0;
  font-size: 20px;
  text-align: left;
  display: inline-block;
  border: 4px solid #000000;
  border-radius: 5px;
  box-sizing: border-box;
}

input[type=submit] {
  width: auto;
  max-width: 100%;
  max-height: 100%;
  height: 100px;
  text-align: center;
  padding: 0px;
  background-color: #F0F0F0;
  color: #000000;
  font-size: 20px;
  padding: 14px 20px;
  margin: 8px 0;
  border: 4px solid #000000;
  border-radius: 5px;
  cursor: pointer;
}

input[type=submit]:hover {
  background-color: #000000;
  color: #F0F0F0;
  text-align: center;
  border: 4px solid #000000;
}

select {
  padding: 12px;
  background-color: #F0F0F0;
  color: #000000;
  font-size: 20px;
  border: 4px solid #000000;
  height: 60px;
  text-align: center;
}

.generalButton {
  font: bold 20px sans-serif;
  text-decoration: none;
  background-color: #B5010F;
  color: #F0F0F0;
  margin-left: 5px;
  margin-right: 5px;
  margin-top: 5px;
  margin-bottom: 5px;  
  padding: 10px 10px 10px 10px;
  border: 5px outset #B5010F;
  border-radius: 5px;
  display: inline-block;
}

.generalButton:hover {
  background-color: #B5010F;
  color: #F0F0F0;
  border: 5px inset #B5010F;
}

.logoutButton {
  background-color: #D2666F;
  border: 5px outset #D2666F;
}

.logoutButton:hover {
  background-color: #D2666F;
  color: #F0F0F0;
  border: 5px inset #D2666F;
}

.homeButton {
  background-color: #32CD32;
  border: 5px outset #32CD32;
}

.homeButton:hover {
  background-color: #32CD32;
  color: #F0F0F0;
  border: 5px inset #32CD32;
}

.LicenseButton {
  background-color: #4169E1;
  border: 5px outset #4169E1;
}

.LicenseButton:hover {
  background-color: #4169E1;
  color: #F0F0F0;
  border: 5px inset #4169E1;
}

.line {
  height: 10px;
  background-color: #B5010F;
  border-top: solid #F0F0F0;
  border-bottom: solid #F0F0F0;
  border-left: solid #F0F0F0;
  border-right: solid #F0F0F0;
  border-radius: 2px;
}

  </style>
</head>
<body>

<div class="wallpaper"></div>
<div class="wallpaper wallpaper2"></div>
<div class="wallpaper wallpaper3"></div>

<br>
<div class="header">
  <h1>
  <a href="/oauth2/sign_out?rd=https://github.com/logout" class="generalButton headerButton logoutButton">Logout</a>
  <a href="/" class="generalButton headerButton homeButton">Home</a>
  <a href="https://github.com/ellwould/yap/blob/main/LICENSE" class="generalButton headerButton LicenseButton">License</a>
  <br>
  ✱ YAP (Yet Another PBX) ✱
  </h1>
</div>
